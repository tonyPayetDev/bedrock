version: '3.8'

services:
  db:
    image: mariadb:10.11 # plus stable et légère
    container_name: bedrock-db
    restart: unless-stopped
    volumes:
      - bedrock-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bedrock
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword

  wordpress:
    image: wordpress:6.5-php8.2-fpm-alpine # image plus légère
    container_name: bedrock-wordpress
    restart: unless-stopped
    working_dir: /var/www/html/web
    volumes:
      - ./web:/var/www/html/web
    environment:
      DB_NAME: bedrock
      DB_USER: wpuser
      DB_PASSWORD: wppassword
      DB_HOST: db:3306
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine # plus légère que alpine pure
    container_name: bedrock-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./web:/var/www/html/web
    depends_on:
      - wordpress

volumes:
  bedrock-db-data:
